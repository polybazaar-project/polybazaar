name: CI - Cloud Functions

# Tests only; deploying stays manual (see the README).
on:
  push:
    branches:
      - main
    paths:
      - functions/**
      - firebase.json
      - .github/workflows/functions.yml
  pull_request:
    paths:
      - functions/**
      - firebase.json
      - .github/workflows/functions.yml

jobs:
  functions:
    name: Cloud Functions tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Firestore emulator runs on the JVM.
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Emulator cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('functions/package.json') }}

      - name: Run tests
        working-directory: functions
        run: npm install --no-audit --no-fund && npm test
